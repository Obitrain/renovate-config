# Renovate runner for the Obitrain GitHub repos (Andarius and polarsen-io have their own
# renovate-config repo; GitLab: obitrain/devops pipeline, obiapp keeps its own job).
# Needs the RENOVATE_TOKEN secret: a PAT with repo scope on Obitrain.
name: renovate

on:
  schedule:
    # this cron is the only time gate (GitHub fires it hours late) — presets set no schedule.
    # 18:00 UTC keeps runs in the evening; GitHub delays only push them later.
    # GitHub suspends schedules in repos inactive >60 days: re-enable from the
    # Actions tab (or run workflow_dispatch) when the reminder email arrives.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Renovate
        uses: renovatebot/github-action@1cd96b855fee0da6f230617e89dbff0e06ea393a # v46.3.5
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: >-
            ["Obitrain/obi",
             "Obitrain/obi-chart",
             "Obitrain/obi-google-auth",
             "Obitrain/obi-image",
             "Obitrain/obi-notifications",
             "Obitrain/obiapp-ui",
             "Obitrain/renovate-config"]
          # Repos without a config get an onboarding PR proposing the base preset (RN libs switch to :lib).
          RENOVATE_ONBOARDING_CONFIG: '{"extends": ["github>Obitrain/renovate-config"]}'
          # lib preset's Expo postUpgradeTasks; exact matches only.
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^yarn install --mode=skip-build$",
             "^yarn --cwd example expo install --fix$",
             "^yarn dedupe$"]
          LOG_LEVEL: info
