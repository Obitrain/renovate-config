# Renovate runner for the Obitrain GitHub repos (Andarius and polarsen-io have their own
# renovate-config repo; GitLab: obitrain/renovate, obiapp keeps its own job).
# Runs as the Renovate GitHub App (vars.RENOVATE_APP_CLIENT_ID, secrets.RENOVATE_APP_PRIVATE_KEY).
name: renovate

on:
  schedule:
    # this cron is the only time gate (GitHub fires it hours late) — presets set no schedule.
    # 18:00 UTC keeps runs in the evening; GitHub delays only push them later.
    # GitHub suspends schedules in repos inactive >60 days: re-enable from the
    # Actions tab (or run workflow_dispatch) when the reminder email arrives.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: echo "author=$SLUG[bot] <$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)+$SLUG[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - name: Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_USERNAME: ${{ steps.app.outputs.app-slug }}[bot]
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.author }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: >-
            ["Obitrain/obi",
             "Obitrain/obi-chart",
             "Obitrain/obi-google-auth",
             "Obitrain/obi-image",
             "Obitrain/obi-notifications",
             "Obitrain/obi-samsung-health",
             "Obitrain/obiapp-ui",
             "Obitrain/renovate-config"]
          # Repos without a config get an onboarding PR proposing the base preset (RN libs switch to :lib).
          RENOVATE_ONBOARDING_CONFIG: '{"extends": ["github>Obitrain/renovate-config"]}'
          # lib preset's Expo postUpgradeTasks; exact matches only.
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^yarn install --mode=skip-build$",
             "^yarn --cwd example expo install --fix$",
             "^yarn dedupe$"]
          LOG_LEVEL: info
